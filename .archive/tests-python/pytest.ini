[pytest]
# Pytest configuration for PowerRebuilder tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests between components
    e2e: End-to-end tests with complete workflows
    performance: Performance and benchmark tests
    slow: Tests that take more than 5 seconds
    pb6: PowerBuilder 6.0 specific tests
    pb8: PowerBuilder 8.0 specific tests
    pb12: PowerBuilder 12.0 specific tests
    pb2022: PowerBuilder 2022 specific tests
    real_files: Tests using real PBD/PBL files
    mock: Tests using mock data

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options
[coverage:run]
source = src_new
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout settings
timeout = 300
timeout_method = thread

# Parallel execution (when using pytest-xdist)
# Use: pytest -n auto
[pytest:xdist]
looponfail = true
