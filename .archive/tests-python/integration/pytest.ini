[pytest]
# Configuration for PowerRebuilder integration tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test categories
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    pipeline: marks tests that run the full pipeline
    stage: marks tests for individual pipeline stages
    error: marks tests for error handling
    performance: marks tests for performance validation

# Test output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout for long-running tests
timeout = 300

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */test_*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
