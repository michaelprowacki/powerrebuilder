[tool:pytest]
# Pytest configuration for PowerRebuilder comprehensive test suite

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    # Performance markers
    slow: marks tests as slow (may take several seconds to minutes)
    performance: marks tests as performance-related (timing/memory benchmarks)
    benchmark: marks tests as benchmarks (use with pytest-benchmark)

    # Security markers
    security: marks tests as security-related
    sql_injection: marks tests for SQL injection prevention
    resource_exhaustion: marks tests for resource exhaustion prevention

    # Component markers
    tiered_detector: marks tests for TieredPCodeDetector
    high_performance: marks tests for HighPerformancePCodeDetector
    extraction: marks tests for extraction components
    parsing: marks tests for parsing components
    generation: marks tests for code generation
    integration: marks tests for full pipeline integration

    # Complexity markers
    unit: marks unit tests
    integration: marks integration tests
    error_handling: marks error handling tests
    boundary: marks boundary condition tests
    concurrency: marks concurrency tests

    # Skip markers
    skip_ci: marks tests to skip in CI environment
    requires_large_memory: marks tests requiring >1GB memory
    requires_network: marks tests requiring network access

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --durations=10
    --color=yes
    --code-highlight=yes

# Coverage configuration
# Run with: pytest --cov=src --cov-report=html --cov-report=term-missing
[coverage:run]
source = src
branch = True
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*
    .tox/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = True
precision = 2
fail_under = 80

[coverage:html]
directory = tests/coverage_html_report
