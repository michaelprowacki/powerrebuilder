# https://taskfile.dev
version: '3'

# Global settings (matching your mise config)
set: [pipefail, errexit, nounset]
shopt: [globstar]

# Output configuration for CI/CD
output:
  group:
    begin: '::group::{{.TASK}}'
    end: '::endgroup::'

# Load .env files automatically
dotenv:
  - '.env'
  - '.env.local'

# Global environment variables
env:
  GITHUB_TOKEN:
    sh: gh auth token 2>/dev/null || true
  CURRENT_BRANCH:
    sh: git branch --show-current 2>/dev/null || true
  PROJECT_NAME:
    sh: basename $(pwd)
  VIRTUAL_ENV:
    sh: echo ${VIRTUAL_ENV:-}

# Include other taskfiles - removed as tasks dir archived

# Main tasks - Direct ports from your mise config
tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  # Hook replacements for mise enter/leave
  enter:
    desc: Initialize project environment (replaces mise hooks.enter)
    cmds:
      - |
        # Load environment files if present (with safety checks)
        if [ -f .env ] && [ -r .env ]; then
          set -a; . ./.env; set +a
        fi
        if [ -f .env.local ] && [ -r .env.local ]; then
          set -a; . ./.env.local; set +a
        fi
        if [ -f .envrc ] && [ -r .envrc ]; then
          set -a; . ./.envrc; set +a
        fi
        # Project-local Python venv (if present)
        if [ -d ".venv" ] && [ -x ".venv/bin/activate" ]; then
          . ".venv/bin/activate"
          echo "Activated Python venv: $VIRTUAL_ENV"
        fi
    silent: true

  # Format task - direct port from mise
  format:
    desc: Auto-format code (ruff, prettier)
    cmds:
      - |
        set -euo pipefail
        if [ -f "pyproject.toml" ]; then
          ruff format .
        fi
        if [ -f "package.json" ]; then
          npx --yes prettier -w .
        fi

  # Type checking - direct port from mise
  type:
    desc: Static type checking (pyright / basedpyright)
    aliases: [typecheck]
    cmds:
      - |
        set -euo pipefail
        if [ -f "pyproject.toml" ]; then
          basedpyright || pyright
        fi

  # Lint task - direct port from mise
  lint:
    desc: Lint (ruff check, eslint if Node present)
    cmds:
      - |
        set -euo pipefail
        if [ -f "pyproject.toml" ]; then
          ruff check .
        fi
        if [ -f "package.json" ]; then
          npx --yes eslint . || true
        fi

  # Test task - direct port from mise
  test:
    desc: Run unit tests (pytest/nextest)
    cmds:
      - |
        set -euo pipefail
        if [ -f "pyproject.toml" ]; then
          pytest -q
        fi
        if [ -f "Cargo.toml" ]; then
          cargo nextest run --all-targets --all-features || cargo test
        fi

  # Coverage task - direct port from mise
  coverage:
    desc: Generate coverage (pytest + coverage)
    cmds:
      - |
        set -euo pipefail
        if [ -f "pyproject.toml" ]; then
          coverage run -m pytest -q
          coverage report -m
        fi

  # Docs task - direct port from mise
  docs:
    desc: Build docs if configured (pdoc/mkdocs, cargo doc)
    cmds:
      - |
        set -euo pipefail
        if [ -f "pyproject.toml" ]; then
          if [ -f "mkdocs.yml" ]; then
            mkdocs build -q || true
          else
            python - <<'PY'
        import importlib.util, sys
        spec = importlib.util.find_spec("pdoc")
        sys.exit(0 if spec else 1)
        PY
            if [ $? -eq 0 ]; then
              pdoc -o docs .
            fi
          fi
        fi
        if [ -f "Cargo.toml" ]; then
          cargo doc --no-deps -q || exit 1
        fi

  # Deps task - direct port from mise with MODE support
  deps:
    desc: Install/Update project deps (Python uv sync; Rust fetch/update; Node install)
    vars:
      MODE: '{{default "install" .DEPS}}'
    cmds:
      - |
        set -euo pipefail
        MODE="{{.MODE}}"

        if [ -f "pyproject.toml" ]; then
          if [ "$MODE" = "update" ]; then
            uv lock --upgrade || true
          fi
          uv sync
        fi

        if [ -f "Cargo.toml" ]; then
          if [ "$MODE" = "update" ]; then
            cargo update
          else
            cargo fetch
          fi
        fi

        if [ -f "package.json" ]; then
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f "bun.lockb" ]; then
            bun install
          else
            npm install
          fi
        fi
        echo "Deps ($MODE) complete."

  deps:update:
    desc: Update all dependencies
    cmds:
      - task: deps
        vars:
          MODE: update

  # Security task - direct port from mise
  security:
    desc: Security checks (pip-audit, cargo-audit, npm audit)
    cmds:
      - |
        set -euo pipefail
        if [ -f "pyproject.toml" ]; then
          pip-audit || true
        fi
        if [ -f "Cargo.toml" ]; then
          cargo audit || true
        fi
        if [ -f "package.json" ]; then
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm audit || true
          elif [ -f "bun.lockb" ]; then
            bun audit || true
          else
            npm audit || true
          fi
        fi

  # Build task - direct port from mise
  build:
    desc: Build all artifacts (Python wheel, Rust release, Node build)
    cmds:
      - |
        set -euo pipefail
        if [ -f "pyproject.toml" ]; then
          python -m build || true
        fi
        if [ -f "Cargo.toml" ]; then
          cargo build --release
        fi
        if [ -f "package.json" ]; then
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm build || true
          elif [ -f "bun.lockb" ]; then
            bun run build || true
          else
            npm run build || true
          fi
        fi

  # Pipeline tasks - direct ports from mise
  check:
    desc: Quick checks (format, type, lint, test)
    deps:
      - format
      - type
      - lint
      - test

  quality:
    desc: Full quality (format, type, lint, test, coverage, docs, security)
    deps:
      - format
      - type
      - lint
      - test
      - coverage
      - docs
      - security

  ci:
    desc: CI pipeline (deps, then full quality checks)
    cmds:
      - task: deps
      - task: quality

  # Info task - enhanced version of mise info
  info:
    desc: Show project/runtime info
    cmds:
      - |
        set -euo pipefail
        echo "Project: ${PROJECT_NAME:-$(basename $PWD)}"
        echo "Directory: $PWD"
        echo ""
        if [ -f "pyproject.toml" ]; then
          echo "Python project detected"
          command -v python >/dev/null 2>&1 && echo "  Python: $(python --version 2>&1)"
          command -v uv >/dev/null 2>&1 && echo "  UV: $(uv --version 2>&1)"
          [ -n "${VIRTUAL_ENV:-}" ] && echo "  Venv: $VIRTUAL_ENV"
        fi
        if [ -f "Cargo.toml" ]; then
          echo "Rust project detected"
          command -v rustc >/dev/null 2>&1 && echo "  Rust: $(rustc --version)"
          command -v cargo >/dev/null 2>&1 && echo "  Cargo: $(cargo --version)"
        fi
        if [ -f "package.json" ]; then
          echo "Node project detected"
          command -v node >/dev/null 2>&1 && echo "  Node: $(node --version)"
          command -v bun >/dev/null 2>&1 && echo "  Bun: $(bun --version)"
        fi

  # Cleanup tasks
  clean:
    desc: Clean all build artifacts
    cmds:
      - rm -rf dist/ build/ target/ node_modules/ .venv/
      - rm -rf .task/ .pytest_cache/ .ruff_cache/
      - find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete 2>/dev/null || true

  clean:dirs:
    desc: Delete empty directories
    cmds:
      - find . -type d -empty -not -path "./.git/*" -not -path "./archive/*" -delete

  clean:safe:
    desc: Delete safe temporary files
    cmds:
      - find . -name "*.pyc" -delete
      - find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
      - find . -name ".DS_Store" -delete
      - rm -rf .pytest_cache .ruff_cache .mypy_cache

  # Benchmarking and profiling tasks
  benchmark:cache:
    desc: Benchmark cache performance
    cmds:
      - uv run python archive/scripts/benchmark_cache.py {{.CLI_ARGS}}

  benchmark:perf:
    desc: Run performance benchmarks
    cmds:
      - uv run python archive/scripts/performance_benchmark.py {{.CLI_ARGS}}

  profile:cpu:
    desc: Profile CPU usage
    cmds:
      - uv run python archive/scripts/profile_cpu.py {{.CLI_ARGS}}

  profile:memory:
    desc: Profile memory usage
    cmds:
      - uv run python archive/scripts/profile_memory.py {{.CLI_ARGS}}

  # Visualization and management
  deps:viz:
    desc: Visualize project dependencies
    cmds:
      - uv run python archive/scripts/dependency_visualizer.py {{.CLI_ARGS}}

  cache:manage:
    desc: Manage project cache
    cmds:
      - uv run python archive/scripts/cache_manager.py {{.CLI_ARGS}}

  # GitHub setup
  github:issues:
    desc: Setup GitHub issues from templates
    cmds:
      - bash archive/scripts/setup_github_issues.sh

  # Comprehensive testing
  test:comprehensive:
    desc: Run comprehensive test suite with options
    cmds:
      - uv run python archive/scripts/run_comprehensive_tests.py {{.CLI_ARGS}}

  test:fast:
    desc: Run fast tests only
    cmds:
      - uv run pytest tests/ -m "not slow" -v

  test:security:
    desc: Run security tests
    cmds:
      - uv run pytest tests/ -m "security" -v

  test:integration:
    desc: Run integration tests
    cmds:
      - uv run pytest tests/integration/ -v

  test:parallel:
    desc: Run tests in parallel
    cmds:
      - uv run pytest tests/ -n auto -v

  test:memray:
    desc: Profile tests with memray
    cmds:
      - |
        if command -v memray >/dev/null 2>&1; then
          memray run -o memray.bin pytest tests/
          memray flamegraph memray.bin
        else
          echo "memray not installed. Install with: pip install memray"
        fi

  install:
    desc: Install project in development mode
    cmds:
      - task: enter
      - task: deps

  dev:
    desc: Start development environment
    deps: [enter, deps]
    cmds:
      - echo "Development environment ready"
      - task: info

  # Watch mode for development
  watch:
    desc: Watch for changes and run checks
    watch: true
    sources:
      - '**/*.{py,js,ts,rs,go}'
      - '!node_modules/**'
      - '!target/**'
      - '!.venv/**'
      - '!dist/**'
      - '!build/**'
    cmds:
      - task: check
