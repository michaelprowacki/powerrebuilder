name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update to perform'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - all

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Check for updates
        id: check-updates
        run: |
          # Create a backup of current lock file
          cp uv.lock uv.lock.backup

          # Check for outdated packages
          echo "## Checking for outdated packages..." > UPDATE_REPORT.md
          echo "" >> UPDATE_REPORT.md

          # Try to update based on input type
          UPDATE_TYPE="${{ inputs.update_type || 'patch' }}"

          case $UPDATE_TYPE in
            patch)
              echo "Updating patch versions only..."
              uv lock --upgrade-package '*@patch'
              ;;
            minor)
              echo "Updating minor versions..."
              uv lock --upgrade-package '*@minor'
              ;;
            major)
              echo "Updating major versions..."
              uv lock --upgrade-package '*@latest'
              ;;
            all)
              echo "Updating all dependencies..."
              uv lock --upgrade
              ;;
          esac

          # Check if there are changes
          if diff -q uv.lock uv.lock.backup > /dev/null; then
            echo "No updates available"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Updates found"
            echo "has_updates=true" >> $GITHUB_OUTPUT

            # Generate update report
            echo "### Updated Packages" >> UPDATE_REPORT.md
            echo "" >> UPDATE_REPORT.md
            echo "\`\`\`diff" >> UPDATE_REPORT.md
            diff -u uv.lock.backup uv.lock | grep -E "^[+-]" | grep -v "^[+-]{3}" | head -50 >> UPDATE_REPORT.md || true
            echo "\`\`\`" >> UPDATE_REPORT.md
          fi

      - name: Run tests with updated dependencies
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          # Install updated dependencies
          uv sync --frozen --all-extras

          # Run quick smoke tests
          uv run pytest tests/ -v -m "not slow" --tb=short || {
            echo "⚠️ Tests failed with updated dependencies" >> UPDATE_REPORT.md
            # Restore original lock file if tests fail
            cp uv.lock.backup uv.lock
            echo "has_updates=false" >> $GITHUB_OUTPUT
            exit 1
          }

          echo "" >> UPDATE_REPORT.md
          echo "✅ All tests passed with updated dependencies" >> UPDATE_REPORT.md

      - name: Check for security improvements
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          echo "" >> UPDATE_REPORT.md
          echo "### Security Check" >> UPDATE_REPORT.md
          echo "" >> UPDATE_REPORT.md

          # Run safety check
          uv tool install safety
          uv run safety check --json > safety-after.json || true

          # Compare with previous if possible
          echo "Security scan completed. Review any vulnerability fixes." >> UPDATE_REPORT.md

      - name: Create Pull Request
        if: steps.check-updates.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): Update ${{ inputs.update_type || 'patch' }} dependencies'
          title: '⬆️ Update ${{ inputs.update_type || 'patch' }} dependencies'
          body: |
            ## Automated Dependency Update

            This PR updates ${{ inputs.update_type || 'patch' }}-level dependencies.

            $(cat UPDATE_REPORT.md)

            ### Pre-merge Checklist
            - [ ] All tests pass
            - [ ] No security vulnerabilities introduced
            - [ ] No breaking changes detected
            - [ ] Documentation updated if needed

            ---
            *This PR was automatically created by the dependency update workflow.*
          branch: deps/update-${{ inputs.update_type || 'patch' }}-${{ github.run_number }}
          delete-branch: true
          labels: |
            dependencies
            automated
            ${{ inputs.update_type || 'patch' }}-update

  update-pre-commit:
    name: Update pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Update pre-commit hooks
        run: |
          pre-commit autoupdate

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet .pre-commit-config.yaml; then
            echo "No pre-commit updates available"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Pre-commit updates found"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Run pre-commit
        if: steps.check-changes.outputs.has_updates == 'true'
        run: |
          pre-commit run --all-files || true

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): Update pre-commit hooks'
          title: '⬆️ Update pre-commit hooks'
          body: |
            ## Pre-commit Hook Updates

            This PR updates the pre-commit hooks to their latest versions.

            ### Changes
            ```diff
            $(git diff .pre-commit-config.yaml)
            ```

            ### Pre-merge Checklist
            - [ ] Pre-commit checks pass
            - [ ] No unexpected behavior changes

            ---
            *This PR was automatically created by the dependency update workflow.*
          branch: deps/update-pre-commit-${{ github.run_number }}
          delete-branch: true
          labels: |
            dependencies
            automated
            pre-commit

  update-github-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Action updates
        uses: actions/github-script@v7
        id: check-updates
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const yaml = require('js-yaml');

            let hasUpdates = false;
            const updates = [];

            // Check all workflow files
            const workflowDir = '.github/workflows';
            const files = fs.readdirSync(workflowDir);

            for (const file of files) {
              if (!file.endsWith('.yml') && !file.endsWith('.yaml')) continue;

              const filePath = path.join(workflowDir, file);
              const content = fs.readFileSync(filePath, 'utf8');

              // Find all action uses
              const actionRegex = /uses:\s*([^@]+)@([^\s]+)/g;
              let match;

              while ((match = actionRegex.exec(content)) !== null) {
                const [full, action, version] = match;

                // Check if there's a newer version (simplified check)
                // In production, you'd check against the actual GitHub API
                if (version.startsWith('v') && !version.includes('sha')) {
                  updates.push({
                    file: file,
                    action: action,
                    currentVersion: version,
                    suggestedVersion: version.replace(/v(\d+)/, (m, v) => `v${parseInt(v) + 1}`)
                  });
                }
              }
            }

            if (updates.length > 0) {
              hasUpdates = true;

              // Create update report
              let report = '## GitHub Actions Updates Available\n\n';
              report += '| Workflow | Action | Current | Suggested |\n';
              report += '|----------|--------|---------|----------|\n';

              for (const update of updates) {
                report += `| ${update.file} | ${update.action} | ${update.currentVersion} | ${update.suggestedVersion} |\n`;
              }

              fs.writeFileSync('ACTION_UPDATES.md', report);
            }

            return hasUpdates;

      - name: Create Pull Request
        if: steps.check-updates.outputs.result == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(ci): Update GitHub Actions'
          title: '⬆️ Update GitHub Actions'
          body: |
            ## GitHub Actions Updates

            This PR updates GitHub Actions to newer versions.

            $(cat ACTION_UPDATES.md)

            ### Pre-merge Checklist
            - [ ] Review action changelog for breaking changes
            - [ ] Verify CI still works correctly

            ---
            *This PR was automatically created by the dependency update workflow.*
          branch: deps/update-actions-${{ github.run_number }}
          delete-branch: true
          labels: |
            dependencies
            automated
            ci
